name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  server:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/sop_ci
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm typecheck
      - name: Run server tests
        shell: bash
        run: |
          set -o pipefail
          pnpm test --runInBand --reporters=github-actions --reporters=summary 2>&1 | tee jest.log
      - name: Upload server test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-jest-log
          path: server/jest.log
          if-no-files-found: ignore
      - run: pnpm build

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sop_e2e
          MYSQL_USER: sop
          MYSQL_PASSWORD: sop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      E2E_TEST: "1"
      PORT: "3001"
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "3306"
      DATABASE_USER: sop
      DATABASE_PASSWORD: sop
      DATABASE_NAME: sop_e2e
      DATABASE_URL: mysql://sop:sop@127.0.0.1:3306/sop_e2e
      JWT_SECRET: e2e-secret-that-is-long-enough-for-tests-only
      JWT_EXPIRATION: 15m
      GOOGLE_CLIENT_ID: e2e-client-id.apps.googleusercontent.com
      ALLOWED_ORIGINS: http://localhost:5173
      PUBLIC_APP_ORIGIN: http://localhost:5173
      E2E_BASE_URL: http://localhost:5173
      E2E_API_BASE_URL: http://localhost:3001/api/v1
      E2E_API_HEALTH_URL: http://localhost:3001/api/health
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install server dependencies
        run: pnpm --dir server install --frozen-lockfile
      - name: Install client dependencies
        run: pnpm --dir client install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --dir server exec prisma generate
      - name: Deploy Prisma migrations to disposable E2E database
        run: pnpm --dir server exec prisma migrate deploy
      - name: Verify migration deployment is idempotent
        run: pnpm --dir server exec prisma migrate deploy
      - name: Seed system templates twice
        run: |
          pnpm --dir server exec ts-node --transpile-only prisma/seed.ts
          pnpm --dir server exec ts-node --transpile-only prisma/seed.ts
      - name: Build server
        run: pnpm --dir server build
      - name: Start server
        shell: bash
        run: |
          pnpm --dir server start:prod > server/e2e-server.log 2>&1 &
          echo $! > server/e2e-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3001/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat server/e2e-server.log
          exit 1
      - name: Install Playwright Chromium
        run: pnpm --dir client exec playwright install --with-deps chromium
      - name: Run MVP vertical slice
        run: pnpm --dir client test:e2e
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mvp-e2e-failure
          path: |
            client/playwright-report
            client/test-results
            server/e2e-server.log
          if-no-files-found: ignore

  production-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCTION_ENV_FILE: .env.production.ci
    steps:
      - uses: actions/checkout@v4

      - name: Create disposable production env
        run: |
          cat > .env.production.ci <<'EOF'
          FRONTEND_PORT=18080
          PUBLIC_APP_ORIGIN=http://localhost:18080
          GOOGLE_CLIENT_ID=ci-client-id.apps.googleusercontent.com
          JWT_SECRET=ci-production-secret-that-is-at-least-32-characters
          JWT_EXPIRATION=15m
          MYSQL_DATABASE=sop_prod_ci
          MYSQL_USER=sop
          MYSQL_PASSWORD=sop-ci-password
          MYSQL_ROOT_PASSWORD=root-ci-password
          SWAGGER_ENABLED=false
          BACKUP_DIR=./backups-ci
          BACKUP_RETENTION_DAYS=14
          EOF

      - name: Validate production contract
        run: bash scripts/production-contract.sh

      - name: Build production images
        run: docker compose --env-file .env.production.ci build

      - name: Start MySQL
        run: docker compose --env-file .env.production.ci up -d --wait mysql

      - name: Deploy migrations twice
        run: |
          docker compose --env-file .env.production.ci run --rm backend pnpm prisma migrate deploy
          docker compose --env-file .env.production.ci run --rm backend pnpm prisma migrate deploy

      - name: Seed system templates twice and verify exact state
        run: |
          docker compose --env-file .env.production.ci run --rm backend node prisma/seed-runtime.cjs
          docker compose --env-file .env.production.ci run --rm backend node prisma/seed-runtime.cjs
          docker compose --env-file .env.production.ci exec -T mysql \
            mysql -N -usop -psop-ci-password sop_prod_ci \
            -e "SELECT COUNT(*) FROM SopTemplate" | grep -qx '3'
          docker compose --env-file .env.production.ci exec -T mysql \
            mysql -N -usop -psop-ci-password sop_prod_ci \
            -e "SELECT COUNT(*) FROM SopTemplateStep" | grep -qx '15'

      - name: Prove MySQL volume persistence
        run: |
          docker compose --env-file .env.production.ci exec -T mysql \
            mysql -usop -psop-ci-password sop_prod_ci \
            -e "CREATE TABLE IF NOT EXISTS ci_persistence_probe (id INT PRIMARY KEY); INSERT IGNORE INTO ci_persistence_probe VALUES (1);"
          docker compose --env-file .env.production.ci stop mysql
          docker compose --env-file .env.production.ci rm -f mysql
          docker compose --env-file .env.production.ci up -d --wait mysql
          docker compose --env-file .env.production.ci exec -T mysql \
            mysql -N -usop -psop-ci-password sop_prod_ci \
            -e "SELECT COUNT(*) FROM ci_persistence_probe WHERE id=1" | grep -qx '1'

      - name: Start production application
        run: docker compose --env-file .env.production.ci up -d --wait backend frontend

      - name: Verify public ingress and readiness
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18080/api/health/ready | grep -q '"status":"ok"'; then
              break
            fi
            if [[ "$attempt" -eq 60 ]]; then
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18080/ >/dev/null

      - name: Prove PDF volume persistence
        run: |
          docker compose --env-file .env.production.ci exec -T backend \
            sh -c 'echo probe > /app/storage/sop-pdf/ci-probe.txt'
          docker compose --env-file .env.production.ci stop backend
          docker compose --env-file .env.production.ci rm -f backend
          docker compose --env-file .env.production.ci up -d --wait backend
          docker compose --env-file .env.production.ci exec -T backend \
            grep -qx probe /app/storage/sop-pdf/ci-probe.txt

      - name: Prove backup retention and create restorable dump
        run: |
          mkdir -p backups-ci
          printf '%s\n' 'old backup probe' | gzip -c > backups-ci/old.sql.gz
          touch -d '20 days ago' backups-ci/old.sql.gz
          backup="$(PRODUCTION_ENV_FILE=.env.production.ci scripts/backup.sh)"
          test -s "$backup"
          gzip -t "$backup"
          test ! -e backups-ci/old.sql.gz
          printf '%s' "$backup" > .production-backup-path

      - name: Prove restore replaces database state
        run: |
          backup="$(cat .production-backup-path)"
          docker compose --env-file .env.production.ci stop frontend backend
          docker compose --env-file .env.production.ci exec -T mysql \
            mysql -usop -psop-ci-password sop_prod_ci \
            -e "DROP TABLE ci_persistence_probe; CREATE TABLE ci_post_backup_probe (id INT PRIMARY KEY); INSERT INTO ci_post_backup_probe VALUES (1);"
          PRODUCTION_ENV_FILE=.env.production.ci scripts/restore.sh "$backup" --yes
          docker compose --env-file .env.production.ci exec -T mysql \
            mysql -N -usop -psop-ci-password sop_prod_ci \
            -e "SELECT COUNT(*) FROM ci_persistence_probe WHERE id=1" | grep -qx '1'
          docker compose --env-file .env.production.ci exec -T mysql \
            mysql -N -usop -psop-ci-password sop_prod_ci \
            -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='sop_prod_ci' AND table_name='ci_post_backup_probe'" | grep -qx '0'
          docker compose --env-file .env.production.ci up -d --wait backend frontend
          curl --fail --silent http://127.0.0.1:18080/api/health/ready | grep -q '"status":"ok"'

      - name: Production Compose diagnostics
        if: failure()
        run: |
          docker compose --env-file .env.production.ci ps || true
          docker compose --env-file .env.production.ci logs --no-color --tail=200 || true

      - name: Cleanup production Compose stack
        if: always()
        run: |
          docker compose --env-file .env.production.ci down -v --remove-orphans || true
          rm -rf .env.production.ci backups-ci .production-backup-path
